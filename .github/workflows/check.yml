name: Check for new releases

on:
  # Roughly every 6 hours, deliberately at odd minutes: GitHub delays and
  # sometimes drops scheduled runs at the top of the hour, its busiest time.
  # Times are UTC (IST alongside). The 00:17 IST run catches releases that
  # went live at midnight IST.
  schedule:
    - cron: "47 18 * * *"   # 00:17 IST
    - cron: "53 0 * * *"    # 06:23 IST
    - cron: "41 6 * * *"    # 12:11 IST
    - cron: "37 12 * * *"   # 18:07 IST
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit the updated state files

concurrency:
  group: release-check
  cancel-in-progress: false

jobs:
  check:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026, and nothing here needs it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ITUNES_COUNTRY: ${{ vars.ITUNES_COUNTRY || 'IN' }}
        run: python track_releases.py

      - name: Save state and keep the schedule alive
        if: always()   # run even if the check step errored, so the cron never sleeps
        run: |
          git config user.name "release-bot"
          git config user.email "actions@users.noreply.github.com"
          # Monthly heartbeat: guarantees repo activity within GitHub's 60-day
          # window, so a long stretch with no new releases can't disable the cron.
          date -u +%Y-%m > .heartbeat
          git add -A
          git diff --cached --quiet || git commit -m "Update state / keep-alive [skip ci]"
          # Pick up any edit made while this run was going (e.g. to artists.txt),
          # so the push isn't rejected and this run's state isn't lost.
          git pull --rebase origin main
          git push
